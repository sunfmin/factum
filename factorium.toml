# How factorium gates factum. A library, not a Homebrew formula: no [cut].

[gate]
fast = "./gate.sh"
fast_limit = 900
slow = "./gate.sh"
slow_limit = 900

# slimfit's tasks and a sample of 5 landed mutants nobody picked, filed as
# issues while the host is idle (factorium SPEC §1.16, `slimfit help sample`).
# No steps: no check here is too slow for the gates. Measured 2026-11-20 at
# background priority: `next --all --fresh` 102s, `next --all --sample 5`
# 428s at load 16-19 (factum#17).
[idle]
tasks = "slimfit --version && slimfit next --all --sample 5"
every = 86400
limit = 1800

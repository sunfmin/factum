[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/engine", "crates/sqlite", "crates/conformance"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/sunfmin/factum"

[workspace.dependencies]
factum-core = { path = "crates/core" }
factum-store = { path = "crates/store" }
factum = { path = "crates/engine" }
factum-conformance = { path = "crates/conformance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
rusqlite = { version = "0.42", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"
